<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSBET · 스포츠 센터</title><style>
:root{--bg:#0e1721;--panel:#1b2936;--panel2:#304355;--line:#425565;--sky:#38bdf8;--text:#edf7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,"Malgun Gothic",sans-serif}header{background:#111820;padding:17px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.logo{font-size:30px;color:var(--sky);font-weight:900;font-style:italic}.tag{color:#a5bbcc}.layout{display:grid;grid-template-columns:220px minmax(310px,1fr) 300px;gap:12px;padding:12px;min-height:calc(100vh - 75px)}aside,main{background:#16222d;border:1px solid #2e4151;border-radius:10px;padding:12px}.nav{width:100%;text-align:left;padding:13px;background:var(--panel2);color:white;border:0;border-bottom:1px solid #17222b;cursor:pointer}.nav:first-child{border-radius:8px 8px 0 0}.nav:last-child{border-radius:0 0 8px 8px}.nav.active,.nav:hover{color:var(--sky)}h3{color:var(--sky);font-size:13px;margin:18px 4px 8px}.muted{color:#a5b8c8}.game{background:var(--panel);border:1px solid #344a5d;border-radius:9px;margin:12px 0;padding:16px}.league{color:var(--sky);font-size:12px;margin-bottom:10px}.teams{font-size:18px;font-weight:700;margin-bottom:13px}.odds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.odd{border:1px solid #496077;background:#15202a;color:white;border-radius:6px;padding:11px 5px;cursor:pointer}.odd:hover,.odd.selected{border-color:var(--sky);background:#16445a}.odd span{display:block;color:#b2c7d6;font-size:11px;margin-bottom:5px}.slip{background:var(--panel);border-radius:8px;padding:12px;margin:12px 0}.button{background:var(--sky);border:0;border-radius:7px;padding:12px;font-weight:800;cursor:pointer;width:100%}input{width:100%;padding:12px;background:#0e1721;border:1px solid #456073;border-radius:6px;color:white}.notice{border:1px solid #4d6575;background:#213442;padding:10px;border-radius:7px;color:#d5e7f1;font-size:12px}.line{display:flex;justify-content:space-between;margin:12px 0}footer{font-size:12px;color:#8fa6b7;margin-top:20px}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{min-height:auto}.nav{display:inline-block;width:auto;border-radius:7px;margin:3px}header{flex-wrap:wrap;gap:10px}}
</style></head><body><header><div class="logo">SSBET</div><div class="tag">SPORTS CENTER · DEMO</div></header><div class="layout"><aside><button class="nav active" onclick="filter('all',this)">⌂ Home</button><button class="nav" onclick="filter('live',this)">◉ 실시간</button><button class="nav" onclick="filter('prematch',this)">▣ 프리 이벤트</button><h3>모든 스포츠</h3><button class="nav" onclick="filter('축구',this)">⚽ 축구 ›</button><button class="nav" onclick="filter('농구',this)">🏀 농구 ›</button><button class="nav" onclick="filter('야구',this)">⚾ 야구 ›</button><button class="nav" onclick="filter('테니스',this)">🎾 테니스 ›</button><button class="nav" onclick="filter('하키',this)">🏒 아이스하키 ›</button><h3>계정</h3><button class="nav" onclick="alert('로그인은 서버 연결 후 제공됩니다.')">⚙ 설정</button></aside><main><div class="notice">테스트 화면입니다. 경기와 배당은 예시 데이터이며 실제 스포츠북 배당 또는 금전 거래가 아닙니다.</div><h2 id="heading">전체 경기</h2><div id="games"></div></main><aside><h2>베팅카트 <span id="count" class="muted">(0)</span></h2><div id="selections" class="muted">배당을 선택하세요.</div><div class="line"><span>총 배당</span><strong id="total">1.00</strong></div><label for="stake">가상 베팅 포인트</label><input id="stake" type="number" min="0" step="100" value="1000" oninput="renderSlip()"><div class="line"><span>예상 지급 포인트</span><strong id="payout">0</strong></div><button class="button" onclick="place()">가상 베팅 기록</button><footer>실제 입출금 및 회원별 정산 기능 없음</footer></aside></div><script>
const games=[{id:1,sport:'축구',league:'프리미어리그',home:'블루 FC',away:'레드 유나이티드',status:'prematch',markets:[['홈 승',1.85],['무승부',3.40],['원정 승',4.10]]},{id:2,sport:'농구',league:'NBA',home:'웨스트 스타즈',away:'이스트 타이탄스',status:'live',markets:[['홈 승',1.92],['-',0],['원정 승',1.88]]},{id:3,sport:'야구',league:'KBO',home:'서울 베어스',away:'부산 자이언츠',status:'prematch',markets:[['홈 승',1.74],['-',0],['원정 승',2.06]]},{id:4,sport:'테니스',league:'ATP',home:'선수 A',away:'선수 B',status:'live',markets:[['선수 A',1.64],['-',0],['선수 B',2.22]]},{id:5,sport:'하키',league:'NHL',home:'노스 울브스',away:'사우스 이글스',status:'prematch',markets:[['홈 승',1.97],['-',0],['원정 승',1.81]]}];
let current='all',selected={};
function filter(f,el){current=f;document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));el.classList.add('active');document.getElementById('heading').textContent=f==='all'?'전체 경기':f==='live'?'실시간':f==='prematch'?'프리 이벤트':f;render();}
function choose(id,i){const g=games.find(x=>x.id===id);if(!g||!g.markets[i][1])return;if(selected[id]?.i===i)delete selected[id];else selected[id]={i};render();renderSlip();}
function render(){document.getElementById('games').innerHTML=games.filter(g=>current==='all'||g.status===current||g.sport===current).map(g=>'<article class="game"><div class="league">'+g.sport+' · '+g.league+' · '+(g.status==='live'?'● LIVE':'경기 전')+'</div><div class="teams">'+g.home+' vs '+g.away+'</div><div class="odds">'+g.markets.map((m,i)=>'<button class="odd '+(selected[g.id]?.i===i?'selected':'')+'" '+(!m[1]?'disabled':'')+' onclick="choose('+g.id+','+i+')"><span>'+m[0]+'</span>'+(m[1]?m[1].toFixed(2):'—')+'</button>').join('')+'</div></article>').join('')||'<p class="muted">표시할 경기가 없습니다.</p>';}
function renderSlip(){let t=1,rows=[];for(const [id,s] of Object.entries(selected)){const g=games.find(x=>x.id==id),m=g.markets[s.i];t*=m[1];rows.push('<div class="slip">'+g.home+' vs '+g.away+'<div class="line"><span>'+m[0]+'</span><b>'+m[1].toFixed(2)+'</b></div><button class="odd" onclick="choose('+id+','+s.i+')">삭제 ×</button></div>');}document.getElementById('selections').innerHTML=rows.join('')||'배당을 선택하세요.';document.getElementById('count').textContent='('+rows.length+')';document.getElementById('total').textContent=rows.length?t.toFixed(2):'1.00';document.getElementById('payout').textContent=rows.length?Math.round(t*Math.max(0,Number(document.getElementById('stake').value)||0)).toLocaleString():'0';}
function place(){if(!Object.keys(selected).length)return alert('배당을 먼저 선택하세요.');alert('가상 베팅 테스트입니다. 실제 베팅은 접수되지 않습니다.');}
render();renderSlip();</script></body></html>

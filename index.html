<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSBET | Sportsbook Preview</title><style>
:root{--bg:#09131d;--surface:#101e2b;--surface2:#172a3b;--surface3:#20394d;--line:#294358;--sky:#40c8ff;--blue:#087cae;--text:#e8f4ff;--muted:#8ca9bd;--gold:#f7c95d}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:13px system-ui,"Malgun Gothic",sans-serif;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}header{background:#07111a;border-bottom:1px solid #203748;position:sticky;top:0;z-index:5}.top{height:34px;background:#101f2c;display:flex;justify-content:space-between;align-items:center;padding:0 22px;color:#8da9bc;font-size:11px}.mainbar{height:69px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:20px}.logo{font-size:36px;font-style:italic;font-weight:1000;letter-spacing:-2px;color:#fff}.logo span{color:var(--sky)}.mainnav{display:flex;gap:27px;align-items:center;font-weight:800}.mainnav a{color:#d9e7f0;text-decoration:none}.mainnav a.on,.mainnav a:hover{color:var(--sky)}.outline,.primary{padding:10px 16px;border-radius:8px;font-weight:800}.outline{background:transparent;color:var(--sky);border:1px solid var(--sky)}.primary{background:linear-gradient(135deg,#4ad2ff,#149bdb);border:0;color:#04121c}.shell{display:grid;grid-template-columns:215px minmax(300px,1fr) minmax(330px,1.07fr) 300px;gap:10px;padding:12px;max-width:1900px;margin:auto;min-height:calc(100vh - 105px)}.panel{background:var(--surface);border:1px solid #243d50;border-radius:10px;overflow:hidden;min-width:0}.side{padding:10px}.sectiontitle{font-size:11px;color:var(--sky);font-weight:900;margin:17px 8px 8px;letter-spacing:.4px}.navitem{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid #182a38;background:#263d50;color:#dcebf4;text-align:left;padding:13px 11px;font-weight:700}.navitem:first-of-type{border-radius:8px 8px 0 0}.navitem.on,.navitem:hover{background:#215476;color:#fff}.league{display:none;background:#122331;padding:4px 10px}.league.open{display:block}.league button{width:100%;padding:9px;border:0;text-align:left;background:transparent;color:#b4c8d7}.league button:hover,.league button.on{color:var(--sky)}.small{font-size:11px;color:var(--muted)}.colhead{padding:13px 15px;background:#172b3a;display:flex;justify-content:space-between;align-items:center;font-weight:900}.tabs{display:flex;gap:6px;padding:10px;background:#0e1a25;overflow:auto}.tab{white-space:nowrap;border:1px solid #2b526b;color:#c4d6e3;background:#142534;border-radius:6px;padding:9px 11px;font-weight:800}.tab.on{background:var(--sky);color:#061b29;border-color:var(--sky)}.search{margin:9px 12px 3px;width:calc(100% - 24px);background:#091722;border:1px solid #29465c;border-radius:7px;padding:11px;color:#fff}.match{margin:10px;border:1px solid #2b4659;border-radius:10px;background:linear-gradient(150deg,#1b3040,#142332);overflow:hidden}.match.active{border-color:#48caff;box-shadow:0 0 0 1px #12668a}.matchhead{display:flex;justify-content:space-between;padding:10px 12px;background:#243c4e;color:#b9d3e3;font-size:11px}.live{color:#55dbff;font-weight:900}.teams{display:flex;justify-content:space-between;align-items:center;padding:19px 12px 15px;gap:8px}.team{flex:1;text-align:center;font-size:12px;font-weight:800}.crest{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#385f77,#0b1b29);border:2px solid #59859e;margin:0 auto 8px;font-size:20px}.score{font-size:24px;white-space:nowrap;font-weight:1000;letter-spacing:1px}.marketrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 10px 11px}.odd{border:1px solid #39556a;background:#0b1925;color:#e8f4ff;border-radius:6px;padding:9px 5px;min-height:46px;font-weight:900}.odd small{display:block;color:#91adbf;font-weight:500;margin-bottom:4px;font-size:10px}.odd:hover,.odd.selected{background:#12577a;border-color:#54d2ff}.odd:disabled{opacity:.35;cursor:default}.hero{background:radial-gradient(ellipse at 50% 0%,#1b6481 0%,#123146 45%,#0c1b29 100%);padding:18px 14px;border-bottom:1px solid #2b4c60}.herotop{display:flex;justify-content:space-between;color:#b3d7e9;font-size:11px}.versus{display:flex;align-items:center;justify-content:space-around;text-align:center;margin:23px 0}.versus .big{font-size:30px;font-weight:1000}.versus .club{font-size:14px;font-weight:800;max-width:110px}.court{height:155px;border:2px solid #75b9d0;border-radius:4px;position:relative;background:linear-gradient(90deg,#167b9d,#12678b);opacity:.95;overflow:hidden}.court:before{content:"";position:absolute;left:50%;height:100%;border-left:2px solid #8cd6ec}.court:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:70px;border:2px solid #8cd6ec;border-radius:50%}.court .key{position:absolute;width:18%;height:65%;border:2px solid #8cd6ec;top:17%}.court .key.left{left:0}.court .key.right{right:0}.time{text-align:center;padding:12px;color:#76dfff;font-weight:900}.markettitle{padding:12px 14px;background:#1c5d7b;color:#fff;font-weight:900;display:flex;justify-content:space-between}.marketgroup{margin:10px;border:1px solid #345269;border-radius:8px;overflow:hidden}.marketgrid{padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.marketgrid .odd{display:flex;justify-content:space-between;align-items:center;padding:12px;font-size:12px}.marketgrid .odd small{display:inline;margin:0}.sliphead{padding:15px;background:#1c5d7b;font-weight:900;display:flex;justify-content:space-between}.slipitem{padding:12px;margin:10px;background:#1c3040;border:1px solid #36576c;border-radius:8px}.slipitem .remove{float:right;background:transparent;border:0;color:#9bb4c4}.line{display:flex;justify-content:space-between;gap:12px;margin:12px 0}.rightbody{padding:12px}.amount{width:100%;padding:12px;background:#091721;border:1px solid #3b596d;border-radius:7px;color:white}.notice{background:#102d40;border:1px solid #276384;padding:10px;border-radius:8px;color:#a9d4eb;font-size:11px;line-height:1.6}.empty{padding:26px 10px;text-align:center;color:#9ab2c4}.foot{color:#7796a9;font-size:11px;padding:10px}.editor{margin-top:20px;padding:12px;border-top:1px solid #29465a}.editor input,.editor select{background:#091721;border:1px solid #3b596d;color:#fff;border-radius:6px;padding:9px;width:100%;margin:5px 0 10px}.editor button{padding:9px;background:#1b5875;color:white;border:1px solid #347fa0;border-radius:6px}.badge{color:#6ddcff;background:#16425b;padding:4px 8px;border-radius:20px;font-size:10px}@media(max-width:1200px){.shell{grid-template-columns:190px minmax(270px,1fr) minmax(310px,1fr)}.right{grid-column:2/4}.mainnav{gap:12px}}@media(max-width:760px){.mainbar{padding:0 12px}.mainnav{gap:9px;font-size:11px;overflow:auto}.mainnav a:nth-child(n+4){display:none}.top{padding:0 12px}.shell{grid-template-columns:1fr}.side,.right{grid-column:auto}.side{max-height:270px;overflow:auto}.hero{padding:12px}.panel{min-width:0}}
</style></head><body><header><div class="top"><span>SSBET SPORTS · PREMIUM PREVIEW</span><span>한국어 · KRW <span class="badge">DEMO</span></span></div><div class="mainbar"><div class="logo">SS<span>BET</span></div><nav class="mainnav"><a class="on" href="#">스포츠</a><a href="#" onclick="notice();return false">라이브</a><a href="#" onclick="notice();return false">카지노</a><a href="#" onclick="notice();return false">미니게임</a><a href="#" onclick="notice();return false">이벤트</a></nav><button class="outline" onclick="notice()">로그인</button></div></header>
<div class="shell"><aside class="panel side"><button class="navitem on" data-filter="all">⌂ &nbsp; Home <span>›</span></button><button class="navitem" data-filter="live">◉ &nbsp; 실시간 <span>›</span></button><button class="navitem" data-filter="prematch">▣ &nbsp; 프리 이벤트 <span>›</span></button><div class="sectiontitle">모든 스포츠</div><div id="sportsNav"></div><div class="sectiontitle">내 메뉴</div><button class="navitem" onclick="notice()">▤ &nbsp; 베팅슬립 <span>›</span></button><button class="navitem" onclick="notice()">⚙ &nbsp; 설정 <span>›</span></button><div class="foot">SSBET · UI Prototype</div></aside>
<section class="panel"><div class="colhead"><span>🔥 스포츠 경기센터</span><span class="badge" id="gameCount">5 경기</span></div><div class="tabs"><button class="tab on" data-filter="all">전체</button><button class="tab" data-filter="live">● LIVE</button><button class="tab" data-filter="prematch">경기 전</button><button class="tab" data-filter="축구">⚽ 축구</button><button class="tab" data-filter="농구">🏀 농구</button></div><input id="search" class="search" placeholder="⌕ 팀명 · 리그 검색"><div id="games"></div></section>
<section class="panel"><div class="colhead"><span>경기 상세 · 배당</span><span class="badge">MATCH CENTER</span></div><div id="detail"></div></section>
<aside class="panel right"><div class="sliphead"><span>▤ 베팅카트 <span id="count">(0)</span></span><span>가상 포인트</span></div><div class="rightbody"><div class="notice">화면의 모든 경기·배당·점수는 예시입니다. 실제 베팅 및 입출금은 지원하지 않습니다.</div><div id="selections" class="empty">선택한 배당이 없습니다.<br>경기 배당을 눌러보세요.</div><div class="line"><span>총 배당률</span><strong id="total">1.00</strong></div><div class="line"><span>가상 베팅 포인트</span></div><input id="stake" class="amount" type="number" min="0" step="100" value="1000"><div class="line"><span>예상 지급 포인트</span><strong id="payout" style="color:var(--sky)">0</strong></div><button class="primary" style="width:100%" onclick="notice()">가상 베팅 확인</button><div class="editor"><strong>⚙ 배당 편집 · 로컬 데모</strong><p class="small">브라우저에만 저장되는 테스트 기능</p><select id="editGame"></select><select id="editMarket"></select><input id="editOdd" type="number" min="1.01" max="1000" step="0.01"><button id="saveOdd">배당 적용</button> <button id="resetOdds">초기화</button></div></div></aside></div>
<script>
const games=[{id:1,sport:'농구',icon:'🏀',league:'NBA',home:'덴버',away:'시카고',score:'110 : 106',status:'live',time:'4쿼터 08:14',markets:[['홈 승',1.24],['-',0],['원정 승',3.75]]},{id:2,sport:'농구',icon:'🏀',league:'NBA',home:'올랜도',away:'워싱턴',score:'85 : 103',status:'live',time:'4쿼터 07:21',markets:[['홈 승',1.92],['-',0],['원정 승',1.88]]},{id:3,sport:'축구',icon:'⚽',league:'프리미어리그',home:'블루 FC',away:'레드 유나이티드',score:'VS',status:'prematch',time:'경기 전',markets:[['홈 승',1.85],['무승부',3.40],['원정 승',4.10]]},{id:4,sport:'야구',icon:'⚾',league:'KBO',home:'서울 베어스',away:'부산 자이언츠',score:'VS',status:'prematch',time:'경기 전',markets:[['홈 승',1.74],['-',0],['원정 승',2.06]]},{id:5,sport:'테니스',icon:'🎾',league:'ATP',home:'선수 A',away:'선수 B',score:'1 : 1',status:'live',time:'2세트',markets:[['선수 A',1.64],['-',0],['선수 B',2.22]]},{id:6,sport:'하키',icon:'🏒',league:'NHL',home:'노스 울브스',away:'사우스 이글스',score:'VS',status:'prematch',time:'경기 전',markets:[['홈 승',1.97],['-',0],['원정 승',1.81]]}];
let filterValue='all',league='',focus=1,selected={};const $=x=>document.getElementById(x);
function notice(){alert('SSBET 디자인 테스트 버전입니다. 실제 거래나 회원 서비스는 제공하지 않습니다.');}
try{const d=JSON.parse(localStorage.getItem('ssbet-demo-odds')||'{}');games.forEach(g=>g.markets.forEach((m,i)=>{const v=d[g.id+'-'+i];if(Number.isFinite(v)&&v>=1.01&&v<=1000&&m[1])m[1]=v;}));}catch(e){}
function setFilter(f){filterValue=f;league='';document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('on',b.dataset.filter===f));renderNav();renderGames();}
function renderNav(){const sports=[['축구','⚽'],['농구','🏀'],['야구','⚾'],['테니스','🎾'],['하키','🏒']];$('sportsNav').innerHTML=sports.map(([s,icon])=>'<button class="navitem '+(filterValue===s?'on':'')+'" data-sport="'+s+'">'+icon+' &nbsp; '+s+' <span>⌄</span></button><div class="league '+(filterValue===s?'open':'')+'">'+['전체 리그',...new Set(games.filter(g=>g.sport===s).map(g=>g.league))].map(l=>'<button data-league="'+l+'" data-sport="'+s+'" class="'+((!league&&l==='전체 리그')||league===l?'on':'')+'">› '+l+'</button>').join('')+'</div>').join('');}
function choose(id,i){const g=games.find(x=>x.id===id);if(!g||!g.markets[i]||!g.markets[i][1])return;if(selected[id]===i)delete selected[id];else selected[id]=i;focus=id;renderGames();renderDetail();renderSlip();}
function focusGame(id){focus=id;renderGames();renderDetail();}
function oddButton(g,i){const m=g.markets[i];return '<button class="odd '+(selected[g.id]===i?'selected':'')+'" '+(!m[1]?'disabled':'')+' data-odd="'+g.id+':'+i+'"><small>'+m[0]+'</small>'+ (m[1]?m[1].toFixed(2):'—')+'</button>';}
function renderGames(){const q=$('search').value.toLowerCase();const list=games.filter(g=>(filterValue==='all'||g.status===filterValue||g.sport===filterValue)&&(!league||g.league===league)&&[g.home,g.away,g.league,g.sport].join(' ').toLowerCase().includes(q));$('gameCount').textContent=list.length+' 경기';$('games').innerHTML=list.map(g=>'<article class="match '+(focus===g.id?'active':'')+'"><div class="matchhead"><span>'+g.icon+' '+g.league+'</span><span class="'+(g.status==='live'?'live':'')+'">'+(g.status==='live'?'● LIVE':'경기 전')+' · '+g.time+'</span></div><div class="teams" data-focus="'+g.id+'" style="cursor:pointer"><div class="team"><div class="crest">'+g.icon+'</div>'+g.home+'</div><div class="score">'+g.score+'</div><div class="team"><div class="crest">'+g.icon+'</div>'+g.away+'</div></div><div class="marketrow">'+g.markets.map((_,i)=>oddButton(g,i)).join('')+'</div></article>').join('')||'<div class="empty">조건에 맞는 경기가 없습니다.</div>';}
function renderDetail(){const g=games.find(x=>x.id===focus)||games[0];$('detail').innerHTML='<div class="hero"><div class="herotop"><span>'+g.icon+' '+g.league+'</span><span>'+(g.status==='live'?'● LIVE · ':'')+g.time+'</span></div><div class="versus"><div class="club">'+g.home+'</div><div class="big">'+g.score+'</div><div class="club">'+g.away+'</div></div><div class="court"><div class="key left"></div><div class="key right"></div></div><div class="time">'+g.time+' · 데모 경기</div></div><div class="marketgroup"><div class="markettitle">▣ 승패 <span>⌃</span></div><div class="marketgrid">'+g.markets.filter(m=>m[1]).map(m=>{const i=g.markets.indexOf(m);return '<button class="odd '+(selected[g.id]===i?'selected':'')+'" data-odd="'+g.id+':'+i+'"><small>'+m[0]+'</small>'+m[1].toFixed(2)+'</button>';}).join('')+'</div></div><div class="marketgroup"><div class="markettitle">▣ 핸디캡 <span class="small">예시 · 선택 불가</span></div><div class="marketgrid"><button class="odd" disabled><small>홈 (-5.5)</small>—</button><button class="odd" disabled><small>원정 (+5.5)</small>—</button></div></div><div class="marketgroup"><div class="markettitle">▣ 오버 / 언더 <span class="small">예시 · 선택 불가</span></div><div class="marketgrid"><button class="odd" disabled><small>오버 (209.5)</small>—</button><button class="odd" disabled><small>언더 (209.5)</small>—</button></div></div>';}
function renderSlip(){let total=1,count=0;let rows='';for(const [id,idx] of Object.entries(selected)){const g=games.find(x=>x.id==id);if(!g)continue;const m=g.markets[idx];total*=m[1];count++;rows+='<div class="slipitem"><button class="remove" data-remove="'+id+'">✕</button><b>'+g.home+' vs '+g.away+'</b><div class="line"><span>'+m[0]+'</span><b>'+m[1].toFixed(2)+'</b></div></div>';} $('selections').className=count?'':'empty';$('selections').innerHTML=rows||'선택한 배당이 없습니다.<br>경기 배당을 눌러보세요.';$('count').textContent='('+count+')';$('total').textContent=count?total.toFixed(2):'1.00';$('payout').textContent=count?Math.round(total*Math.max(0,Number($('stake').value)||0)).toLocaleString():'0';}
document.addEventListener('click',e=>{const b=e.target.closest('[data-odd],[data-focus],[data-filter],[data-sport],[data-league],[data-remove]');if(!b)return;if(b.dataset.odd){const [id,i]=b.dataset.odd.split(':').map(Number);choose(id,i);}else if(b.dataset.focus)focusGame(Number(b.dataset.focus));else if(b.dataset.remove){delete selected[b.dataset.remove];renderSlip();renderGames();renderDetail();}else if(b.dataset.league){filterValue=b.dataset.sport;league=b.dataset.league==='전체 리그'?'':b.dataset.league;renderNav();renderGames();}else if(b.dataset.sport){setFilter(b.dataset.sport);}else if(b.dataset.filter){setFilter(b.dataset.filter);}});
$('search').oninput=renderGames;$('stake').oninput=renderSlip;
const eg=$('editGame'),em=$('editMarket'),eo=$('editOdd');games.forEach(g=>eg.add(new Option(g.home+' vs '+g.away,g.id)));function syncMarkets(){const g=games.find(x=>x.id==eg.value);em.innerHTML='';g.markets.forEach((m,i)=>{if(m[1])em.add(new Option(m[0],i));});syncOdd();}function syncOdd(){const g=games.find(x=>x.id==eg.value);eo.value=g.markets[Number(em.value)][1].toFixed(2);}eg.onchange=syncMarkets;em.onchange=syncOdd;syncMarkets();
$('saveOdd').onclick=()=>{const v=Number(eo.value),g=games.find(x=>x.id==eg.value),i=Number(em.value);if(!Number.isFinite(v)||v<1.01||v>1000)return alert('배당은 1.01~1000 사이로 입력하세요.');g.markets[i][1]=v;let d={};try{d=JSON.parse(localStorage.getItem('ssbet-demo-odds')||'{}')}catch(e){}d[g.id+'-'+i]=v;localStorage.setItem('ssbet-demo-odds',JSON.stringify(d));renderGames();renderDetail();renderSlip();alert('브라우저 데모 배당에 적용했어.');};
$('resetOdds').onclick=()=>{localStorage.removeItem('ssbet-demo-odds');location.reload();};renderNav();renderGames();renderDetail();renderSlip();
</script></body></html>
